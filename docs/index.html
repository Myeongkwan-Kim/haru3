<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="하루 세 아이">
<meta name="theme-color" content="#FCFCFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>하루 세 아이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Jua&display=swap">
<style>
:root{
  --ground:#FCFCFB;
  --surface:#FFFFFF;
  --surface-2:#F3F5F3;
  --ink:#1A2522;
  --ink-2:#4E5A56;
  --ink-3:#66726E;
  --line:#DDE2DF;
  --line-2:#869390;
  --accent:#2F6B5C;
  --accent-ink:#FFFFFF;
  --accent-soft:#E6F0EC;
  --accent-strong:#2F6B5C;
  --warn:#8C5411;
  --warn-soft:#FBF0E1;
  --danger:#9E3617;
  --danger-line:#D8B3A8;
  --good:#2F6B5C;
  --good-soft:#E3F0E9;
  --watch:#8C5411;
  --watch-soft:#FBF0E1;
  --mood-a:#2E5C86;
  --mood-b:#6E9DC4;
  --mood-c:#9A9E9B;
  --mood-d:#D69440;
  --mood-e:#96520F;
  --shadow:0 1px 2px rgba(26,37,34,.06), 0 8px 24px rgba(26,37,34,.06);
  --sheet-shadow:0 -2px 32px rgba(26,37,34,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131A18;
    --surface:#1C2422;
    --surface-2:#242E2B;
    --ink:#E7EDEA;
    --ink-2:#AEBAB6;
    --ink-3:#8A9591;
    --line:#333F3B;
    --line-2:#68776F;
    --accent:#5FA894;
    --accent-ink:#0E1614;
    --accent-soft:#1E2E2A;
    --accent-strong:#5FA894;
    --warn:#D9A45C;
    --warn-soft:#2B241A;
    --danger:#E3937A;
    --danger-line:#553A31;
    --good:#5FA894;
    --good-soft:#1E2E2A;
    --watch:#D9A45C;
    --watch-soft:#2B241A;
    --mood-a:#8FBBE0;
    --mood-b:#5E90B8;
    --mood-c:#767C79;
    --mood-d:#C89149;
    --mood-e:#E5A85E;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    --sheet-shadow:0 -2px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#131A18;
  --surface:#1C2422;
  --surface-2:#242E2B;
  --ink:#E7EDEA;
  --ink-2:#AEBAB6;
  --ink-3:#8A9591;
  --line:#333F3B;
  --line-2:#68776F;
  --accent:#5FA894;
  --accent-ink:#0E1614;
  --accent-soft:#1E2E2A;
  --accent-strong:#5FA894;
  --warn:#D9A45C;
  --warn-soft:#2B241A;
  --danger:#E3937A;
  --danger-line:#553A31;
  --good:#5FA894;
  --good-soft:#1E2E2A;
  --watch:#D9A45C;
  --watch-soft:#2B241A;
  --mood-a:#8FBBE0;
  --mood-b:#5E90B8;
  --mood-c:#767C79;
  --mood-d:#C89149;
  --mood-e:#E5A85E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  --sheet-shadow:0 -2px 32px rgba(0,0,0,.5);
}
/* 귀여운 테마. 한 가지 밝은 세계에 의도적으로 고정하므로 다크 대응을 두지
   않는다. 다크 블록들보다 뒤에 있어야 어떤 기기 설정에서도 이긴다.
   상태 축(mood) 색만은 기본 테마와 같은 값을 쓴다 — 그 색은 장식이 아니라
   의미이고(docs/adr/0003), 테마에 따라 뜻이 달라지면 안 된다. */
:root[data-skin="cute"]{
  --ground:#FFF7F0;
  --surface:#FFFFFF;
  --surface-2:#FFF0E4;
  --ink:#5A4438;
  --ink-2:#7E6656;
  --ink-3:#7F6A5D;
  --line:#F2E0D2;
  --line-2:#A87F62;
  --accent:#FFC9B4;
  --accent-ink:#5A4438;
  --accent-soft:#FFEDE4;
  --accent-strong:#B2503A;
  --warn:#94531F;
  --warn-soft:#FFF1DC;
  --danger:#B24A33;
  --danger-line:#E0B5A6;
  --good:#3E8A62;
  --good-soft:#E6F4EA;
  --watch:#94531F;
  --watch-soft:#FFF1DC;
  --shadow:0 2px 0 #F0DCCB, 0 6px 18px rgba(122,86,62,.10);
  --sheet-shadow:0 -2px 28px rgba(122,86,62,.20);
}
:root[data-skin="cute"] .name,
:root[data-skin="cute"] .sheet-title,
:root[data-skin="cute"] .child-name,
:root[data-skin="cute"] .panel h3,
:root[data-skin="cute"] .sec-title,
:root[data-skin="cute"] .today,
:root[data-skin="cute"] .btn,
:root[data-skin="cute"] .btn-sm.primary,
:root[data-skin="cute"] .tally-item b{
  font-family:'Jua','IBM Plex Sans KR',sans-serif;
  letter-spacing:0;
  font-weight:400;
}
:root[data-skin="cute"] .btn,
:root[data-skin="cute"] .btn-sm.primary,
:root[data-skin="cute"] .range[aria-pressed="true"]{border:1px solid var(--line-2)}
:root[data-skin="cute"] .card{border-radius:18px;box-shadow:var(--shadow)}
:root[data-skin="cute"] .card:active{transform:scale(.95)}
:root[data-skin="cute"] .panel,
:root[data-skin="cute"] .entry{border-radius:18px}
:root[data-skin="cute"] .btn,
:root[data-skin="cute"] .btn-ghost,
:root[data-skin="cute"] .btn-sm,
:root[data-skin="cute"] .row-in,
:root[data-skin="cute"] .row-del,
:root[data-skin="cute"] .row-add,
:root[data-skin="cute"] .note-in,
:root[data-skin="cute"] .out,
:root[data-skin="cute"] .edit-area{border-radius:14px}
:root[data-skin="cute"] .word,
:root[data-skin="cute"] .range{border-radius:999px}
:root[data-skin="cute"] .mood{border-radius:20px;padding:12px 2px 11px}
:root[data-skin="cute"] .btn:disabled{background:var(--surface-2);border-color:var(--line);color:var(--ink-3)}
:root[data-skin="cute"] .sheet{border-radius:26px 26px 0 0}
:root[data-skin="cute"] .gaps{border-radius:4px 16px 16px 4px}
:root[data-skin="cute"] .banner{border-radius:16px}
/* 마스코트: 특정 작품의 캐릭터가 아니라 이 앱을 위해 그린 도형이다.
   말랑말랑 테마에서만 나타나고 기본 테마는 차분하게 둔다. */
.mascot{display:none}
:root[data-skin="cute"] .mascot{display:block;flex:0 0 auto;width:52px;height:52px}
:root[data-skin="cute"] .gaps{display:flex;gap:10px;align-items:flex-start}
:root[data-skin="cute"] .gaps-body{flex:1;min-width:0}
:root[data-skin="cute"] .empty .mascot{width:84px;height:84px;margin:0 auto 12px}
:root[data-skin="cute"] .mascot-wave{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){:root[data-skin="cute"] .mascot-wave{animation:none}}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
body.locked{position:fixed;left:0;right:0;overflow:hidden;width:100%}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--ground)}

.alert{position:sticky;top:0;z-index:40;background:var(--danger);color:#fff;padding:11px 16px;font-size:13.5px;line-height:1.5;font-weight:500}
.alert b{font-weight:700}

.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px}
.today{font-size:13px;color:var(--ink-2);letter-spacing:.02em}
.today b{color:var(--ink);font-weight:600}
.today .klass{color:var(--accent-strong);font-weight:600;margin-right:2px}
.count-today{font-size:12px;color:var(--ink-3);letter-spacing:.04em}

main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sec-title{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
.sec-note{font-size:12px;color:var(--ink-3)}

.gaps{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:2px 10px 10px 2px;padding:13px 15px}
.gaps .sec-title{color:var(--warn)}
.gap-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;align-items:center}
.gap-chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line-2);padding:6px 11px;border-radius:999px;font-size:14px;font-weight:500}
.gap-chip .d{font-size:11.5px;color:var(--warn);font-weight:600}
.gap-more{font-size:12.5px;color:var(--warn);font-weight:600}
.gaps-clear{font-size:13.5px;color:var(--ink-2);margin-top:2px}

/* 아이 목록. 기록 내용은 절대 싣지 않는다 — 아이들이 옆에서 화면을 본다. */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:12px 13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:74px;transition:border-color .12s,transform .06s}
.card:active{transform:scale(.985)}
.card.done{border-color:var(--accent-strong);background:var(--accent-soft)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.card-meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.card-meta .stale{color:var(--warn);font-weight:600}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{padding:11px 0 13px;font-size:12px;font-weight:500;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button[aria-current="page"]{color:var(--accent-strong);font-weight:600}
.nav .ico{font-size:17px;line-height:1}

.scrim{position:fixed;inset:0;background:rgba(16,24,22,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--sheet-shadow);transform:translateY(102%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.3,1), visibility 0s .22s;max-height:92vh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.3,1), visibility 0s}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 14px 10px 18px;border-bottom:1px solid var(--line)}
.sheet-title{font-size:19px;font-weight:700;letter-spacing:-.02em}
.sheet-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.sheet-close{font-size:14px;color:var(--ink-2);padding:12px;margin:-6px;min-width:44px;min-height:44px}
.sheet-body{padding:14px 18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.field-label{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--ink-2);margin-bottom:8px}
.field-hint{font-weight:400;color:var(--ink-3);letter-spacing:0}

.note-in{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:12px 13px;background:var(--surface);resize:none;font-size:16px;line-height:1.6;min-height:104px}
.note-in::placeholder{color:var(--ink-3);font-size:14.5px}

/* 자주 쓴 말: 미리 만든 분류가 아니라 본인이 쓴 표현이 돌아오는 것이다. */
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2);background:var(--surface);min-height:40px}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.mood{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.mood .em{font-size:21px;line-height:1}
.mood .lb{font-size:10.5px;color:var(--ink-3);letter-spacing:-.02em}
.mood .bar{width:100%;height:4px;border-radius:2px}
.mood[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.mood[aria-pressed="true"] .lb{color:var(--ink);font-weight:600}

.sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:12px}
.btn{flex:1;padding:14px;border-radius:11px;font-size:15.5px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{background:var(--surface-2);color:var(--ink-2);cursor:default}
.btn-ghost{flex:0 0 auto;padding:14px 16px;border-radius:11px;border:1px solid var(--danger-line);font-size:14.5px;color:var(--danger);background:var(--surface)}

/* ---------- 상담 화면 ---------- */
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;padding:11px 14px;border-radius:999px;min-height:44px;border:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:600}

.child-name{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.ranges{display:flex;gap:6px;flex-wrap:wrap}
.range{padding:9px 13px;border-radius:8px;border:1px solid var(--line-2);font-size:13px;color:var(--ink-2);min-height:40px}
.range[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.tally{display:flex;gap:8px;flex-wrap:wrap}
.tally-item{display:inline-flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:8px;font-size:13px;background:var(--surface-2);color:var(--ink-2)}
.tally-item b{font-size:15px;font-weight:700;color:var(--ink)}
.tally-item.good{background:var(--good-soft);color:var(--good)}
.tally-item.good b{color:var(--good)}
.tally-item.watch{background:var(--watch-soft);color:var(--watch)}
.tally-item.watch b{color:var(--watch)}

.only-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px}
.only-toggle span{font-size:13.5px;color:var(--ink-2)}
.only-toggle button{font-size:13px;font-weight:600;color:var(--accent-strong);padding:8px 12px;border:1px solid var(--line-2);border-radius:999px;min-height:38px}
.only-toggle button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.entries{display:flex;flex-direction:column;gap:8px}
.entry{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.entry.good{background:var(--good-soft);border-color:var(--good)}
.entry.watch{background:var(--watch-soft);border-color:var(--watch)}
.entry-top{display:flex;align-items:baseline;gap:8px}
.entry-date{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.entry-mood{font-size:12.5px;color:var(--ink-2)}
.entry-text{font-size:15px;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.entry-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mark-btn{padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);background:var(--surface);min-height:38px}
.mark-btn.good[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}
.mark-btn.watch[aria-pressed="true"]{background:var(--watch);border-color:var(--watch);color:#fff;font-weight:600}
.entry-edit{margin-left:auto;font-size:12.5px;color:var(--ink-3);padding:8px 10px;min-height:38px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.panel p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:12px 14px;border-radius:9px;border:1px solid var(--line-2);font-size:13.5px;font-weight:500;background:var(--surface);min-height:44px}
.btn-sm.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-sm.danger{color:var(--danger);border-color:var(--danger-line)}

.rows{display:flex;flex-direction:column;gap:7px}
.row-edit{display:grid;grid-template-columns:1fr 44px;gap:7px;align-items:center}
.row-in{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;background:var(--ground);font-size:16px;min-height:44px}
.row-del{min-height:44px;border:1px solid var(--line-2);border-radius:9px;color:var(--ink-3);font-size:17px;line-height:1}
.row-add{align-self:flex-start;padding:11px 14px;border-radius:9px;border:1px dashed var(--line-2);font-size:13.5px;color:var(--ink-2);min-height:44px}
.edit-area{width:100%;min-height:112px;border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;background:var(--ground);font-size:16px;line-height:1.65;resize:vertical}
.out{width:100%;min-height:100px;border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;background:var(--ground);font-size:12px;line-height:1.5;resize:vertical;font-family:'IBM Plex Mono',ui-monospace,monospace}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink-2)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner b{color:var(--ink);font-weight:600}
.banner button{font-size:13px;font-weight:600;color:var(--accent-strong);white-space:nowrap;padding:6px 0}
.banner.warn button{color:var(--warn)}

.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:70;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.empty{padding:28px 6px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.7}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>

</head>
<body>
<div id="app">
  <div class="alert" id="alertBar" role="alert" hidden></div>
  <div class="top">
    <div class="top-row">
      <div class="today" id="todayLine"></div>
      <div class="count-today tnum" id="countLine"></div>
    </div>
  </div>
  <main id="view"></main>
  <nav class="nav">
    <div class="nav-inner">
      <button data-tab="record" aria-current="page"><span class="ico">✎</span>기록</button>
      <button data-tab="child"><span class="ico">◔</span>상담</button>
      <button data-tab="data"><span class="ico">⤓</span>데이터</button>
    </div>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <div>
      <div class="sheet-title" id="sheetTitle"></div>
      <div class="sheet-sub" id="sheetSub"></div>
    </div>
    <button class="sheet-close" id="sheetClose">닫기</button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div>
      <textarea class="note-in" id="noteIn" rows="4" placeholder="짧게 흘려 써도 됩니다&#10;예) 블록 무너지자 울음 → 혼자 다시 쌓음"></textarea>
    </div>
    <div id="wordWrap" hidden>
      <div class="field-label">자주 쓰신 말 <span class="field-hint">— 눌러서 넣기</span></div>
      <div class="words" id="wordBox"></div>
    </div>
    <div>
      <div class="field-label">그때 아이 상태 <span class="field-hint">— 안 골라도 됩니다</span></div>
      <div class="moods" id="moodBox"></div>
    </div>
  </div>
  <div class="sheet-foot">
    <button class="btn-ghost" id="delBtn" hidden>삭제</button>
    <button class="btn" id="saveBtn" disabled>저장</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
var KEY = "haru3.v1";
var SCHEMA = 3;
var MOODS = [
  {v:-2, em:"😔", lb:"위축", c:"var(--mood-a)"},
  {v:-1, em:"😕", lb:"시무룩", c:"var(--mood-b)"},
  {v: 0, em:"😐", lb:"평소", c:"var(--mood-c)"},
  {v: 1, em:"🙂", lb:"밝음", c:"var(--mood-d)"},
  {v: 2, em:"😄", lb:"활발", c:"var(--mood-e)"}
];
var DEMO_NAMES = ["서준","하윤","도윤","지우","시우","서아","하준","지호","예린","유준","다은","건우"];
var DEMO_LINES = [
  "블록 무너지자 울음 → 혼자 다시 쌓음",
  "오늘도 혼자 놀이. 먼저 다가가진 않음",
  "친구한테 먼저 같이 하자고 함",
  "이름 불러도 대답 잘 안 함",
  "간식 시간에 처음으로 다 먹음",
  "낮잠 안 자고 계속 뒤척임",
  "그림 오래 붙잡고 집중함",
  "줄 서기 어려워함. 자꾸 앞으로"
];
var STALE_DAYS = 4;
var GAP_SHOWN = 6;
var BACKUP_NAG_DAYS = 5;
var RANGES = [
  {k:"1m", lb:"최근 1개월", days:31},
  {k:"3m", lb:"최근 3개월", days:93},
  {k:"all", lb:"전체", days:0}
];

/* ---------------- state ---------------- */
var S = null;
var ui = { tab:"record", pick:null, editing:null, draft:null, openBulk:false,
           range:"3m", onlyMarked:false };
var storageBroken = false;
var storageCorrupt = false;
var lastRenderedDay = null;
var sheetReturnFocus = null;
var scrollLockY = 0;

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ return iso(new Date()); }
function daysBetween(a,b){
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---------------- schema ----------------
   v3에서 태그와 시간대를 걷어냈다. 미리 만든 분류에 생각을 맞추는 일이
   기록의 실제 부담이었고, 정리는 쓰는 시점이 아니라 읽는 시점(상담 준비)의
   일이기 때문이다. 자유 텍스트 하나와, 읽으며 칠하는 표시(mark)만 남는다. */
function blank(){
  return {
    v:SCHEMA,
    rev:0,
    demo:false,
    children:[],
    entries:[],
    lastExport:null,
    skin:"cute",
    group:"우리 반"
  };
}

function normalize(p){
  if (!p || typeof p !== "object" || Array.isArray(p)) return null;

  if (!Array.isArray(p.children)) p.children = [];
  p.children = p.children
    .filter(function(c){ return c && typeof c === "object" && c.id; })
    .map(function(c){ return {id:String(c.id), name:String(c.name === undefined ? "이름 없음" : c.name)}; });

  if (!Array.isArray(p.entries)) p.entries = [];
  p.entries = p.entries
    .filter(function(e){ return e && typeof e === "object" && e.date && e.childId; })
    .map(function(e){
      var mark = (e.mark === "good" || e.mark === "watch") ? e.mark : null;
      return {
        id: String(e.id || uid()),
        date: String(e.date), childId: String(e.childId),
        text: typeof e.text === "string" ? e.text : "",
        mood: (typeof e.mood === "number") ? e.mood : null,
        mark: mark,
        ts: String(e.ts || new Date().toISOString())
      };
    })
    .filter(function(e){ return e.text.trim() !== "" || e.mood !== null; });

  delete p.slots;
  delete p.tags;

  p.v = SCHEMA;
  if (typeof p.rev !== "number") p.rev = 0;
  if (typeof p.lastExport !== "string") p.lastExport = null;
  p.demo = !!p.demo;
  // 기본값은 말랑말랑. 명시적으로 기본 테마를 고른 사람만 plain으로 남는다.
  p.skin = (p.skin === "plain") ? "plain" : "cute";
  p.group = (typeof p.group === "string" && p.group.trim()) ? p.group.trim() : "우리 반";
  return p;
}

function migrate(p){
  if (!p || typeof p !== "object" || !Array.isArray(p.children)) return null;

  // v1: 시간대가 문자열이고 기록 id에 그 이름이 박혀 있었다.
  if ((!p.v || p.v < 2) && Array.isArray(p.slots)){
    var map = {};
    p.slots = p.slots.map(function(s){
      if (s && typeof s === "object" && s.id) return s;
      var o = {id:uid(), name:String(s)};
      map[o.name] = o.id;
      return o;
    });
    p.entries = (p.entries || []).map(function(e){
      var slotId = e.slotId || map[e.slot] || uid();
      return {
        id: e.date + "|" + slotId + "|" + e.childId,
        date: e.date, slotId: slotId, childId: e.childId,
        tags: e.tags || [], mood: (e.mood === undefined ? null : e.mood),
        note: e.note || "", ts: e.ts || new Date().toISOString()
      };
    });
    p.v = 2;
  }

  // v2 → v3: 태그와 한 줄 메모를 하나의 자유 텍스트로 합치고 시간대를 버린다.
  if (p.v < 3){
    var slotName = {};
    (p.slots || []).forEach(function(s){ if (s && s.id) slotName[s.id] = s.name; });
    p.entries = (p.entries || []).map(function(e){
      var bits = [];
      if (Array.isArray(e.tags) && e.tags.length) bits.push(e.tags.join(", "));
      if (e.note) bits.push(e.note);
      var where = slotName[e.slotId];
      var text = bits.join(" · ");
      if (where && text) text = "[" + where + "] " + text;
      else if (where) text = "[" + where + "]";
      return {
        id: uid(), date: e.date, childId: e.childId,
        text: text, mood: (e.mood === undefined ? null : e.mood),
        mark: null, ts: e.ts || new Date().toISOString()
      };
    });
    p.v = 3;
  }

  return normalize(p);
}

function demoState(){
  var s = blank();
  s.demo = true;
  s.children = DEMO_NAMES.map(function(n){ return {id:uid(), name:n}; });
  var seed = 7;
  function rnd(){ seed = (seed*1103515245 + 12345) % 2147483648; return seed/2147483648; }
  // 두 명은 일부러 비워 둔다. 첫 화면의 "놓치고 있는 아이"가 할 말이 있어야 한다.
  var quiet = [3,9];
  for (var back = 6; back >= 0; back--){
    var d = new Date(); d.setDate(d.getDate()-back);
    var date = iso(d);
    for (var k = 0; k < 3; k++){
      var ci, tries = 0;
      do { ci = Math.floor(rnd()*s.children.length); tries++; }
      while (quiet.indexOf(ci) !== -1 && tries < 40);
      var c = s.children[ci];
      s.entries.push({
        id: uid(), date: date, childId: c.id,
        text: DEMO_LINES[Math.floor(rnd()*DEMO_LINES.length)],
        mood: [-2,-1,0,0,1,1,2][Math.floor(rnd()*7)],
        mark: rnd() > .78 ? (rnd() > .5 ? "good" : "watch") : null,
        ts: new Date().toISOString()
      });
    }
  }
  var q = s.children[3];
  var old = new Date(); old.setDate(old.getDate()-11);
  s.entries.push({id:uid(), date:iso(old), childId:q.id,
    text:"오늘도 혼자 놀이. 먼저 다가가진 않음", mood:0, mark:null, ts:new Date().toISOString()});
  return s;
}

/* ---------------- storage ----------------
   모든 쓰기는 저장소를 다시 읽어 그 위에 얹는다. 어제부터 열려 있던 탭이
   그 사이 다른 탭이 저장한 것을 지우지 못하게 한다. 실패는 삼키지 않는다. */
function readStore(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }
  catch(e){ return null; }
  if (!raw) return null;
  try{
    var p = migrate(JSON.parse(raw));
    if (!p) throw new Error("shape");
    return p;
  }catch(e){
    // "읽지 못했다"와 "비어 있다"는 다르다. 원본을 보존하고 알린다.
    if (!storageCorrupt){
      storageCorrupt = true;
      try{
        if (!localStorage.getItem(KEY + ".broken")) localStorage.setItem(KEY + ".broken", raw);
      }catch(e2){}
    }
    return null;
  }
}

function writeStore(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    if (storageBroken){ storageBroken = false; renderAlert(); }
    return true;
  }catch(e){
    storageBroken = true;
    renderAlert();
    return false;
  }
}

function mutate(fn){
  var fresh = readStore();
  if (fresh && (fresh.rev || 0) > (S.rev || 0)) S = fresh;
  fn(S);
  S.rev = (S.rev || 0) + 1;
  return writeStore();
}

// 상태를 통째로 바꾸는 경로(복원·초기화)도 저장소보다 앞서야 한다.
function bumpRev(st, prevRev){
  var cur = readStore();
  st.rev = Math.max((cur && cur.rev) || 0, prevRev || 0, st.rev || 0) + 1;
}

function load(){
  var p = readStore();
  if (p) return p;
  return demoState();
}

// 테마는 기록과 함께 저장된다 — 복원하면 쓰던 화면 그대로 돌아온다.
function applySkin(){
  if (S && S.skin === "cute") document.documentElement.setAttribute("data-skin", "cute");
  else document.documentElement.removeAttribute("data-skin");
}

function renderAlert(){
  var el = document.getElementById("alertBar");
  if (storageBroken){
    el.hidden = false;
    el.innerHTML = "<b>저장되지 않고 있습니다.</b> 이 기기의 브라우저가 저장을 막고 있어요. " +
      "지금까지 입력한 내용은 화면을 닫으면 사라집니다. 데이터 탭에서 먼저 내보내세요.";
    return;
  }
  if (storageCorrupt){
    el.hidden = false;
    el.innerHTML = "<b>저장된 기록을 읽지 못했습니다.</b> 지금 보이는 것은 이전 기록이 아닙니다. " +
      "원본은 지우지 않고 따로 보관해 두었으니, 기록하기 전에 먼저 알려주세요.";
    return;
  }
  el.hidden = true;
}

/* ---------------- helpers ---------------- */
function moodOf(v){
  if (v === null || v === undefined) return null;
  for (var i=0;i<MOODS.length;i++) if (MOODS[i].v === v) return MOODS[i];
  return null;
}
function entriesOf(childId){
  return S.entries.filter(function(e){ return e.childId === childId; })
    .sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts || "") < (a.ts || "") ? -1 : 1;
    });
}
function todayCount(childId){
  var n = 0, t = today();
  S.entries.forEach(function(e){ if (e.childId === childId && e.date === t) n++; });
  return n;
}
function lastDate(childId){
  var es = entriesOf(childId);
  return es.length ? es[0].date : null;
}
function sinceDays(childId){
  var d = lastDate(childId);
  return d === null ? null : daysBetween(d, today());
}
function orphanEntries(){
  var known = {};
  S.children.forEach(function(c){ known[c.id] = 1; });
  return S.entries.filter(function(e){ return !known[e.childId]; });
}

// 조사만 대충 떼어낸다. 완벽할 필요는 없다 — 본인이 쓴 말을 되돌려주는 용도다.
var STOP = {"오늘":1,"아이":1,"그냥":1,"조금":1,"계속":1,"다시":1,"내내":1,"같이":1,"약간":1,"제일":1,"진짜":1,"너무":1,"아직":1,"먼저":1};
function stem(w){
  w = w.replace(/[.,!?~…"'()\[\]·→\-]/g, "");
  if (w.length < 2) return "";
  w = w.replace(/(이랑|에서|에게|한테|으로|까지|부터|보다|이가|은는|을를|와과|랑|의|도|만|에|이|가|은|는|을|를|로)$/, "");
  if (w.length < 2) return "";
  return w;
}
function frequentWords(limit){
  var tally = {};
  S.entries.forEach(function(e){
    var seen = {};
    e.text.split(/\s+/).forEach(function(raw){
      var w = stem(raw);
      if (!w || STOP[w] || seen[w]) return;
      seen[w] = 1;
      tally[w] = (tally[w] || 0) + 1;
    });
  });
  return Object.keys(tally)
    .filter(function(w){ return tally[w] >= 2; })
    .sort(function(a,b){ return tally[b] - tally[a] || (a < b ? -1 : 1); })
    .slice(0, limit || 8);
}

var toastT = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove("show"); }, 2400);
}

// 표정만 바꿔 재사용한다. worry = 놓친 아이가 있을 때, happy = 다 본 날.
function mascot(mood, extraClass){
  var worry = (mood === "worry");
  var mouth = worry ? "M29.5 45.8 q2.5 -2.2 5 0" : "M29.5 43.6 q2.5 2.8 5 0";
  var brow = worry
    ? '<path d="M20 29.6 q4 -2.2 7.6 0.6" stroke="#8A6B52" stroke-width="1.9" fill="none" stroke-linecap="round"/>' +
      '<path d="M36.4 30.2 q3.6 -2.8 7.6 -0.6" stroke="#8A6B52" stroke-width="1.9" fill="none" stroke-linecap="round"/>'
    : "";
  return '<svg class="mascot ' + (extraClass || "") + '" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' +
    '<ellipse cx="25" cy="55.5" rx="5.4" ry="3.5" fill="#FFF6EC" stroke="#A87F62" stroke-width="2"/>' +
    '<ellipse cx="39" cy="55.5" rx="5.4" ry="3.5" fill="#FFF6EC" stroke="#A87F62" stroke-width="2"/>' +
    '<circle cx="11.8" cy="43.5" r="3.8" fill="#FFF6EC" stroke="#A87F62" stroke-width="2"/>' +
    '<circle cx="52.2" cy="43.5" r="3.8" fill="#FFF6EC" stroke="#A87F62" stroke-width="2"/>' +
    '<path d="M32 20 C32 12, 27 8.5, 23.5 11 C20 13.5, 25.5 20, 32 20 Z" fill="#A9D49B"/>' +
    '<path d="M32 20 C32 13, 37 9.5, 40.5 12 C44 14.5, 38.5 20, 32 20 Z" fill="#86BE7C"/>' +
    '<line x1="32" y1="18" x2="32" y2="24" stroke="#86BE7C" stroke-width="2.4" stroke-linecap="round"/>' +
    '<ellipse cx="32" cy="37" rx="20.5" ry="17.5" fill="#FFF6EC" stroke="#A87F62" stroke-width="2.3"/>' +
    brow +
    '<circle cx="24.3" cy="36" r="4.4" fill="#4A3529"/>' +
    '<circle cx="25.9" cy="34.3" r="1.6" fill="#FFFFFF"/>' +
    '<circle cx="39.7" cy="36" r="4.4" fill="#4A3529"/>' +
    '<circle cx="41.3" cy="34.3" r="1.6" fill="#FFFFFF"/>' +
    '<ellipse cx="15.8" cy="42.2" rx="4.4" ry="3.3" fill="#FF9AA0" opacity=".95"/>' +
    '<ellipse cx="48.2" cy="42.2" rx="4.4" ry="3.3" fill="#FF9AA0" opacity=".95"/>' +
    '<path d="' + mouth + '" stroke="#4A3529" stroke-width="2" fill="none" stroke-linecap="round"/>' +
    '</svg>';
}

/* ---------------- header ---------------- */
function renderTop(){
  var d = new Date();
  var wd = ["일","월","화","수","목","금","토"][d.getDay()];
  document.getElementById("todayLine").innerHTML =
    '<span class="klass">' + esc(S.group) + '</span> ' +
    "<b>" + (d.getMonth()+1) + "월 " + d.getDate() + "일</b> " + wd + "요일";
  var n = 0, uniq = {};
  S.entries.forEach(function(e){ if (e.date === today()){ n++; uniq[e.childId] = 1; } });
  document.getElementById("countLine").textContent =
    "오늘 " + Object.keys(uniq).length + "명 · " + n + "건";
}

/* ---------------- record tab ---------------- */
function viewRecord(){
  var v = document.getElementById("view");
  v.innerHTML = "";

  if (S.demo){
    var bn = document.createElement("div");
    bn.className = "banner";
    bn.innerHTML = "<span><b>예시 데이터</b>로 보고 있습니다</span>";
    var b = document.createElement("button");
    b.textContent = "우리 반으로 바꾸기";
    b.onclick = function(){ ui.tab = "data"; ui.openBulk = true; render(true); };
    bn.appendChild(b);
    v.appendChild(bn);
  } else {
    var nag = backupNag();
    if (nag) v.appendChild(nag);
  }

  if (!S.children.length){
    var em = document.createElement("div");
    em.className = "empty";
    em.innerHTML = mascot("happy") + "아직 아이가 등록되지 않았습니다.<br>데이터 탭에서 이름을 넣어주세요.";
    v.appendChild(em);
    return;
  }

  // 오래 못 본 아이. 정렬을 안정적으로 두어 같은 아이만 계속 잘리지 않게 한다.
  var stale = S.children.map(function(c){ return {c:c, s:sinceDays(c.id)}; })
    .filter(function(x){ return x.s === null || x.s >= STALE_DAYS; })
    .sort(function(a,b){
      var av = a.s === null ? Infinity : a.s;
      var bv = b.s === null ? Infinity : b.s;
      if (av !== bv) return bv - av;
      return a.c.name < b.c.name ? -1 : a.c.name > b.c.name ? 1 : 0;
    });

  var g = document.createElement("section");
  g.className = "gaps";
  if (stale.length){
    var shown = stale.slice(0, GAP_SHOWN);
    var html = '<div class="sec-head"><span class="sec-title">놓치고 있는 아이</span>' +
      '<span class="sec-note">' + STALE_DAYS + '일 넘게 기록이 없어요</span></div><div class="gap-list">';
    shown.forEach(function(x){
      html += '<span class="gap-chip">' + esc(x.c.name) +
        '<span class="d ' + (x.s === null ? "" : "mono") + '">' +
        (x.s === null ? "아직 없음" : x.s + "일") + '</span></span>';
    });
    if (stale.length > shown.length){
      html += '<span class="gap-more tnum">외 ' + (stale.length - shown.length) + '명</span>';
    }

/* ---------------- sheet ---------------- */
function openSheet(child, existing){
  // 열 때의 날짜를 붙잡아 둔다. 자정을 넘겨도 수정은 수정으로 남아야 한다.
  ui.editing = {child:child, existing:existing, date: existing ? existing.date : today()};
  ui.draft = existing
    ? {text:existing.text || "", mood:(existing.mood === undefined ? null : existing.mood)}
    : {text:"", mood:null};

  document.getElementById("sheetTitle").textContent = child.name;
  var s = sinceDays(child.id);
  document.getElementById("sheetSub").textContent = existing
    ? existing.date + " 기록 고치기"
    : (s === null ? "첫 기록" : s === 0 ? "오늘 이미 기록함" : "마지막 기록 " + s + "일 전");

  var ni = document.getElementById("noteIn");
  ni.value = ui.draft.text;
  ni.oninput = function(){ ui.draft.text = ni.value; syncSave(); };

  // 처음에는 아무것도 안 뜬다. 쓴 말이 쌓여야 생긴다.
  var words = frequentWords(8);
  var ww = document.getElementById("wordWrap");
  var wb = document.getElementById("wordBox");
  wb.innerHTML = "";
  ww.hidden = !words.length;
  words.forEach(function(w){
    var b = document.createElement("button");
    b.className = "word"; b.textContent = w;
    b.onclick = function(){
      var cur = ni.value;
      ni.value = cur + (cur && !/\s$/.test(cur) ? " " : "") + w + " ";
      ui.draft.text = ni.value;
      ni.focus();
      syncSave();
    };
    wb.appendChild(b);
  });

  var mb = document.getElementById("moodBox");
  mb.innerHTML = "";
  MOODS.forEach(function(m){
    var b = document.createElement("button");
    b.className = "mood";
    b.setAttribute("aria-pressed", ui.draft.mood === m.v ? "true" : "false");
    b.setAttribute("aria-label", m.lb);
    b.innerHTML = '<span class="em">' + m.em + '</span><span class="lb">' + m.lb +
      '</span><span class="bar" style="background:' + m.c + '"></span>';
    b.onclick = function(){
      ui.draft.mood = (ui.draft.mood === m.v) ? null : m.v;
      Array.prototype.forEach.call(mb.children, function(x, i){
        x.setAttribute("aria-pressed", MOODS[i].v === ui.draft.mood ? "true" : "false");
      });
      syncSave();
    };
    mb.appendChild(b);
  });

  document.getElementById("delBtn").hidden = !existing;
  syncSave();

  sheetReturnFocus = document.activeElement;
  lockScroll();
  var sheet = document.getElementById("sheet");
  sheet.setAttribute("aria-modal", "true");
  document.getElementById("scrim").classList.add("open");
  sheet.classList.add("open");
  document.getElementById("sheetBody").scrollTop = 0;
  setTimeout(function(){ try{ ni.focus(); }catch(e){} }, 80);
}

function syncSave(){
  var d = ui.draft;
  var ok = d && (d.text.trim() !== "" || d.mood !== null);
  var b = document.getElementById("saveBtn");
  b.disabled = !ok;
  b.textContent = !ok ? "한 줄 적어주세요"
    : (ui.editing && ui.editing.existing ? "수정 저장" : "저장");
}

function lockScroll(){
  scrollLockY = window.scrollY || 0;
  document.body.style.top = (-scrollLockY) + "px";
  document.body.classList.add("locked");
}
function unlockScroll(){
  document.body.classList.remove("locked");
  document.body.style.top = "";
  window.scrollTo(0, scrollLockY);
}

function closeSheet(){
  var sheet = document.getElementById("sheet");
  document.getElementById("scrim").classList.remove("open");
  sheet.classList.remove("open");
  sheet.removeAttribute("aria-modal");
  ui.editing = null; ui.draft = null;
  unlockScroll();
  if (sheetReturnFocus && sheetReturnFocus.focus){
    try{ sheetReturnFocus.focus(); }catch(e){}
  }
  sheetReturnFocus = null;
}

function commit(){
  var e = ui.editing, d = ui.draft;
  if (!e || !d) return;
  var name = e.child.name;
  var existingId = e.existing ? e.existing.id : null;
  var rec = {
    id: existingId || uid(),
    date: e.date,
    childId: e.child.id,
    text: d.text.trim(),
    mood: d.mood,
    mark: e.existing ? e.existing.mark : null,
    ts: new Date().toISOString()
  };
  var ok = mutate(function(st){
    var idx = -1;
    if (existingId){
      for (var i=0;i<st.entries.length;i++) if (st.entries[i].id === existingId) idx = i;
    }
    if (idx === -1) st.entries.push(rec); else st.entries[idx] = rec;
    st.demo = false;
  });
  closeSheet(); render();
  // 일어나지 않은 저장을 성공이라 말하지 않는다.
  if (ok) toast(name + " 기록됨");
  else toast("저장되지 않았습니다 — 위 경고를 확인하세요");
}

function removeEntry(){
  var e = ui.editing;
  if (!e || !e.existing) return;
  if (!confirm(e.child.name + "의 이 기록을 지웁니다. 되돌릴 수 없습니다.")) return;
  var id = e.existing.id;
  var ok = mutate(function(st){
    st.entries = st.entries.filter(function(x){ return x.id !== id; });
  });
  closeSheet(); render();
  toast(ok ? "삭제했습니다" : "저장되지 않았습니다 — 위 경고를 확인하세요");
}

/* ---------------- export / import ---------------- */
function csvCell(x){
  x = String(x === null || x === undefined ? "" : x);
  // 앞머리의 =, +, -, @ 는 스프레드시트가 수식으로 읽는다. 순수 숫자는 예외로
  // 둬야 상태값 -1, -2 가 글자로 바뀌지 않는다.
  if (/^[=+\-@]/.test(x) && !/^-?\d+(\.\d+)?$/.test(x)) x = "'" + x;
  return /[",\r\n]/.test(x) ? '"' + x.replace(/"/g,'""') + '"' : x;
}
function toCSV(){
  var names = {};
  S.children.forEach(function(c){ names[c.id] = c.name; });
  var MARKLB = {good:"칭찬할 것", watch:"지켜볼 것"};
  var rows = [["date","child","child_id","text","mood","mood_label","mark"].join(",")];
  S.entries.slice().sort(function(a,b){
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.ts || "") < (b.ts || "") ? -1 : 1;
  }).forEach(function(e){
    var m = moodOf(e.mood);
    rows.push([
      csvCell(e.date),
      csvCell(names[e.childId] || "(명단에 없음)"), csvCell(e.childId),
      csvCell(e.text),
      csvCell(e.mood === null || e.mood === undefined ? "" : e.mood),
      csvCell(m ? m.lb : ""),
      csvCell(e.mark ? MARKLB[e.mark] : "")
    ].join(","));
  });
  return rows.join("\r\n");
}
function markExported(){
  mutate(function(st){ st.lastExport = today(); });
}
function copyText(text, label){
  var out = document.getElementById("outBox");
  if (out) out.value = text;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      markExported(); render(); toast(label + " 복사됨 — 카톡에 붙여넣어 두세요");
    }, function(){ toast("아래 칸에서 직접 복사하세요"); });
  } else {
    toast("아래 칸에서 직접 복사하세요");
  }
}
// iOS 공유 시트: 두 번 눌러 카톡으로 백업이 넘어간다.
function shareCSV(){
  var body = toCSV();
  // 엑셀이 한글 열을 제대로 열도록 BOM을, 파일명은 받는 앱이 헷갈리지 않도록 영문으로.
  var csv = "﻿" + body;
  var name = "haru3-" + today() + ".csv";
  var done = function(){ markExported(); render(); toast("보냈으면 백업 완료입니다"); };
  try{
    var file = new File([csv], name, {type:"text/csv"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:name}).then(done, function(){});
      return;
    }
  }catch(e){}
  // 전체 CSV를 채팅 본문으로 보내면 잘릴 수 있어 짧을 때만 텍스트로 넘긴다.
  if (navigator.share && body.length < 4000){
    navigator.share({title:name, text:body}).then(done, function(){});
    return;
  }
  copyText(body, "CSV");
}

    if (!confirm("아이 " + parsed.children.length + "명, 기록 " + parsed.entries.length +
      "건으로 되돌립니다.\n지금 기록 " + S.entries.length + "건은 사라집니다. 계속할까요?")) return;
    // 저장보다 렌더를 먼저 시도한다. 그리지 못하는 상태를 저장해 버리면
    // 새로고침해도 백지인 앱이 남는다.
    var prev = S, prevTab = ui.tab, prevPick = ui.pick;
    S = parsed; ui.tab = "record"; ui.pick = null;
    try{
      render(true);
    }catch(err){
      S = prev; ui.tab = prevTab; ui.pick = prevPick;
      render(true);
      toast("이 백업은 열 수 없습니다. 복사한 내용을 다시 확인해 주세요");
      return;
    }
    bumpRev(S, prev.rev);
    var ok = writeStore();
    toast(ok ? "복원했습니다" : "복원했지만 저장되지 않았습니다");
  };
  r0.appendChild(b0);
  p0.appendChild(r0);
  v.appendChild(p0);

  v.appendChild(rowEditor({
    title:S.group + " 아이들",
    groupEdit:true,
    bulkOpen:true,
    desc:"이름을 고쳐도 그 아이의 기록은 그대로 따라갑니다. 지우면 그 아이의 기록도 함께 사라집니다.",
    list:S.children,
    addLabel:"+ 아이 추가",
    placeholder:"이름",
    countOf:function(c){ return S.entries.filter(function(e){ return e.childId === c.id; }).length; },
    onDelete:function(c, n){
      return confirm(c.name + " 을(를) 명단에서 지웁니다." +
        (n ? "\n이 아이의 기록 " + n + "건도 함께 사라집니다." : "") + "\n계속할까요?");
    },
    remove:function(st, id){
      st.children = st.children.filter(function(x){ return x.id !== id; });
      st.entries = st.entries.filter(function(e){ return e.childId !== id; });
    },
    add:function(st, name){ st.children.push({id:uid(), name:name}); },
    rename:function(st, id, name){
      st.children.forEach(function(c){ if (c.id === id) c.name = name; });
    },
    bulkApply:function(st, names){
      var byName = {}, used = {};
      st.children.forEach(function(c){ if (!(c.name in byName)) byName[c.name] = c; });
      var next = names.map(function(n){
        var hit = byName[n];
        if (hit && !used[hit.id]){ used[hit.id] = 1; return hit; }
        return {id:uid(), name:n};
      });
      var keep = {};
      next.forEach(function(c){ keep[c.id] = 1; });
      st.children = next;
      st.entries = st.entries.filter(function(e){ return keep[e.childId]; });
      st.demo = false;
    }
  }));

  // 명단 교체 뒤 남은 예시 기록을 짚어 준다.
  var orphans = orphanEntries();
  if (orphans.length){
    var po = document.createElement("section");
    po.className = "panel";
    po.innerHTML = "<h3>명단에 없는 기록</h3><p>지금 명단에 없는 아이의 기록이 <b>" +
      orphans.length + "건</b> 남아 있습니다. 예시 데이터를 눌러본 뒤 명단을 바꿨다면 이것입니다. " +
      "그대로 두면 CSV에도 함께 나갑니다.</p>";
    var ro = document.createElement("div"); ro.className = "row-btns";
    var bo = document.createElement("button");
    bo.className = "btn-sm danger"; bo.textContent = orphans.length + "건 지우기";
    bo.onclick = function(){
      if (!confirm("명단에 없는 기록 " + orphans.length + "건을 지웁니다. 되돌릴 수 없습니다.")) return;
      var ok = mutate(function(st){
        var known = {};
        st.children.forEach(function(c){ known[c.id] = 1; });
        st.entries = st.entries.filter(function(e){ return known[e.childId]; });
      });
      render(); toast(ok ? "정리했습니다" : "저장되지 않았습니다");
    };
    ro.appendChild(bo);
    po.appendChild(ro);
    v.appendChild(po);
  }

  var pt = document.createElement("section");
  pt.className = "panel";
  pt.innerHTML = "<h3>화면 테마</h3><p>색과 글꼴만 바뀝니다. 기록과 데이터는 그대로입니다.</p>";
  var rt = document.createElement("div"); rt.className = "row-btns";
  [["cute","말랑말랑"],["plain","기본"]].forEach(function(pair){
    var tb = document.createElement("button");
    tb.className = "btn-sm" + (S.skin === pair[0] ? " primary" : "");
    tb.textContent = pair[1];
    tb.setAttribute("aria-pressed", S.skin === pair[0] ? "true" : "false");
    tb.onclick = function(){
      if (S.skin === pair[0]) return;
      var ok = mutate(function(st){ st.skin = pair[0]; });
      render();
      toast(ok ? pair[1] + " 테마로 바꿨습니다" : "저장되지 않았습니다");
    };
    rt.appendChild(tb);
  });
  pt.appendChild(rt);
  v.appendChild(pt);

  var p5 = document.createElement("section");
  p5.className = "panel";
  p5.innerHTML = "<h3>초기화</h3><p>지우기 전에 반드시 위에서 백업하세요. 되돌릴 수 없습니다.</p>";
  var r5 = document.createElement("div"); r5.className = "row-btns";
  var d1 = document.createElement("button");
  d1.className = "btn-sm"; d1.textContent = "예시 데이터 다시 넣기";
  d1.onclick = function(){
    if (!confirm("지금 기록을 모두 버리고 예시 데이터로 되돌립니다. 계속할까요?")) return;
    var fresh = demoState();
    fresh.skin = S.skin;
    bumpRev(fresh, S.rev);
    S = fresh;
    var ok = writeStore();
    ui.tab = "record"; ui.pick = null;
    render(true); toast(ok ? "예시 데이터로 되돌렸습니다" : "저장되지 않았습니다");
  };
  var d2 = document.createElement("button");
  d2.className = "btn-sm danger"; d2.textContent = "기록 전체 삭제";
  d2.onclick = function(){
    if (!confirm("기록을 모두 지웁니다. 명단은 남습니다. 계속할까요?")) return;
    var ok = mutate(function(st){ st.entries = []; st.demo = false; });
    render(); toast(ok ? "기록을 모두 지웠습니다" : "저장되지 않았습니다");
  };
  r5.appendChild(d1); r5.appendChild(d2);
  p5.appendChild(r5);
  v.appendChild(p5);
}

// 행 단위 편집기: 이름을 고쳐도 그 행의 id가 유지되므로 기록이 가리키던
// 대상을 잃지 않는다. 이름 목록 textarea로는 할 수 없던 일이다.
function rowEditor(cfg){
  var p = document.createElement("section");
  p.className = "panel";
  p.innerHTML = "<h3>" + esc(cfg.title) + "</h3><p>" + cfg.desc + "</p>";

  if (cfg.groupEdit){
    var gl = document.createElement("div");
    gl.className = "field-label";
    gl.textContent = "반 이름";
    var gi = document.createElement("input");
    gi.className = "row-in"; gi.type = "text";
    gi.value = S.group; gi.placeholder = "반 이름";
    gi.setAttribute("aria-label", "반 이름");
    gi.onchange = function(){
      var g = gi.value.trim();
      if (!g){ gi.value = S.group; toast("반 이름을 비울 수 없습니다"); return; }
      var ok = mutate(function(st){ st.group = g; });
      render(); toast(ok ? "반 이름을 바꿨습니다" : "저장되지 않았습니다");
    };
    p.appendChild(gl); p.appendChild(gi);
  }

  var rows = document.createElement("div");
  rows.className = "rows";
  cfg.list.forEach(function(item){
    var row = document.createElement("div");
    row.className = "row-edit";
    var inp = document.createElement("input");
    inp.className = "row-in"; inp.type = "text";
    inp.value = item.name; inp.placeholder = cfg.placeholder;
    inp.setAttribute("aria-label", cfg.placeholder);
    inp.onchange = function(){
      var name = inp.value.trim();
      if (!name){ inp.value = item.name; toast("이름을 비울 수 없습니다"); return; }
      // 한 반에 동명이인은 흔하다. 막지 않되 알려는 준다.
      if (name !== item.name && cfg.list.some(function(it){ return it.id !== item.id && it.name === name; })){
        toast("같은 이름이 이미 있어요");
      }
      var ok = mutate(function(st){ cfg.rename(st, item.id, name); });
      if (!ok) toast("저장되지 않았습니다");
      renderTop();
    };
    var del = document.createElement("button");
    del.className = "row-del"; del.textContent = "×";
    del.setAttribute("aria-label", item.name + " 지우기");
    del.onclick = function(){
      var n = cfg.countOf(item);
      if (!cfg.onDelete(item, n)) return;
      var ok = mutate(function(st){ cfg.remove(st, item.id); });
      render(); toast(ok ? "지웠습니다" : "저장되지 않았습니다");
    };
    row.appendChild(inp); row.appendChild(del);
    rows.appendChild(row);
  });
  p.appendChild(rows);

  var addRow = document.createElement("div");
  addRow.className = "row-btns";
  var add = document.createElement("button");
  add.className = "row-add"; add.textContent = cfg.addLabel;
  add.onclick = function(){
    var name = prompt(cfg.placeholder + "을(를) 입력하세요");
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    if (cfg.list.some(function(it){ return it.name === name; })) toast("같은 이름이 이미 있어요");
    var ok = mutate(function(st){ cfg.add(st, name); });
    render(); toast(ok ? "추가했습니다" : "저장되지 않았습니다");
  };
  addRow.appendChild(add);

  // 한 명씩 prompt로 반을 만들면 모달을 25번 넘게 눌러야 한다.
  if (cfg.bulkApply){
    var bulkBtn = document.createElement("button");
    bulkBtn.className = "row-add"; bulkBtn.textContent = "여러 개 한 번에";
    addRow.appendChild(bulkBtn);
    var box = document.createElement("div");
    box.hidden = !(cfg.bulkOpen && ui.openBulk);
    var warn = document.createElement("p");
    warn.style.color = "var(--warn)";
    warn.style.marginTop = "10px";
    warn.innerHTML = "<b>처음 명단을 만들 때만 쓰세요.</b> 여기서 이름을 고치면 " +
      "그 아이는 빠지고 새 아이가 생겨 기록이 사라집니다. " +
      "<b>이름 수정은 위 목록에서 직접</b> 하세요.";
    var ta = document.createElement("textarea");
    ta.className = "edit-area";
    ta.placeholder = "한 줄에 하나씩 붙여넣으세요";
    ta.setAttribute("aria-label", cfg.title + " 한 번에 입력");
    var apply = document.createElement("button");
    apply.className = "btn-sm primary"; apply.textContent = "이 목록으로 교체";
    apply.style.marginTop = "8px";
    apply.onclick = function(){
      var names = ta.value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
      if (!names.length){ toast("한 줄에 하나씩 입력해 주세요"); return; }
      var keptNames = {};
      names.forEach(function(n){ keptNames[n] = 1; });
      var dropped = cfg.list.filter(function(it){ return !keptNames[it.name]; });
      var lostRecords = dropped.reduce(function(sum, it){ return sum + cfg.countOf(it); }, 0);
      var msg = cfg.title + "을(를) " + names.length + "명으로 바꿉니다.";
      if (dropped.length) msg += "\n빠지는 " + dropped.length + "명" +
        (lostRecords ? "의 기록 " + lostRecords + "건도 함께 사라집니다." : " 은(는) 기록이 없습니다.");
      msg += "\n계속할까요?";
      if (!confirm(msg)) return;
      var ok = mutate(function(st){ cfg.bulkApply(st, names); });
      ui.pick = null;
      render(); toast(ok ? "목록을 바꿨습니다" : "저장되지 않았습니다");
    };
    box.appendChild(warn); box.appendChild(ta); box.appendChild(apply);
    if (!box.hidden){
      ta.value = cfg.list.map(function(it){ return it.name; }).join("\n");
      ui.openBulk = false;
    }
    bulkBtn.onclick = function(){
      box.hidden = !box.hidden;
      if (!box.hidden){
        ta.value = cfg.list.map(function(it){ return it.name; }).join("\n");
        ta.focus();
      }
    };
    p.appendChild(addRow);
    p.appendChild(box);
    return p;
  }

  p.appendChild(addRow);
  return p;
}

/* ---------------- routing ---------------- */
function render(resetScroll){
  lastRenderedDay = today();
  applySkin();
  renderAlert();
  renderTop();
  if (ui.tab === "record") viewRecord();
  else if (ui.tab === "child") viewChild();
  else viewData();
  Array.prototype.forEach.call(document.querySelectorAll(".nav button"), function(b){
    if (b.dataset.tab === ui.tab) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  // 탭이 바뀔 때만 맨 위로. 목록 아래쪽 아이를 기록하고 나서 목록이 처음으로
  // 되감기면 연달아 남기는 리듬이 끊긴다.
  if (resetScroll) window.scrollTo(0,0);
}

Array.prototype.forEach.call(document.querySelectorAll(".nav button"), function(b){
  b.onclick = function(){
    if (ui.tab === b.dataset.tab) return;
    ui.tab = b.dataset.tab;
    render(true);
  };
});
document.getElementById("scrim").onclick = closeSheet;
document.getElementById("sheetClose").onclick = closeSheet;
document.getElementById("saveBtn").onclick = commit;
document.getElementById("delBtn").onclick = removeEntry;

document.addEventListener("keydown", function(e){
  var sheet = document.getElementById("sheet");
  if (!sheet.classList.contains("open")) return;
  if (e.key === "Escape"){ closeSheet(); return; }
  if (e.key !== "Tab") return;
  // 열린 시트 안에 Tab을 가둔다.
  var f = sheet.querySelectorAll("button, textarea, input, [tabindex]");
  var list = Array.prototype.filter.call(f, function(el){ return !el.disabled && el.offsetParent !== null; });
  if (!list.length) return;
  var first = list[0], last = list[list.length-1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

// 다른 탭이 저장했다면 그것을 받아들인다. 나중에 이 탭이 덮어쓰지 않도록.
window.addEventListener("storage", function(e){
  if (e.key !== KEY) return;
  var fresh = readStore();
  if (fresh && (fresh.rev || 0) > (S.rev || 0)){
    S = fresh;
    // 작성 중인 시트나 입력 중인 데이터 탭 위에 다시 그리지 않는다.
    if (document.getElementById("sheet").classList.contains("open")) return;
    if (ui.tab === "data") return;
    render();
  }
});

// 홈 화면 아이콘으로 열어둔 채 날짜가 바뀔 수 있다.
function checkDay(){
  if (lastRenderedDay && today() !== lastRenderedDay) render();
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden) checkDay(); });
window.addEventListener("pageshow", checkDay);
setInterval(checkDay, 60000);

// 오프라인 껍데기. 자체 호스팅 빌드에만 sw.js가 있고, 없는 곳에서는 등록이
// 실패한 뒤 그대로 무시된다.
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

// 명단을 링크로 심는다: .../haru3/#class=라임 반&names=LEO,JOSEPH,...
// 아이 실명을 공개 저장소 코드에 넣지 않기 위한 것이다. 해시는 서버로
// 전송되지 않으므로 이름은 링크를 받은 사람의 기기 밖으로 나가지 않는다.
function groupFromHash(){
  var m = (location.hash || "").match(/[#&]class=([^&]*)/);
  if (!m) return null;
  var raw;
  try{ raw = decodeURIComponent(m[1].replace(/\+/g, " ")); }
  catch(e){ raw = m[1]; }
  raw = raw.trim();
  return raw || null;
}
function namesFromHash(){
  var m = (location.hash || "").match(/[#&]names=([^&]*)/);
  if (!m) return null;
  var raw;
  try{ raw = decodeURIComponent(m[1].replace(/\+/g, " ")); }
  catch(e){ raw = m[1]; }
  var names = raw.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
  return names.length ? names : null;
}

S = load();

var seeded = namesFromHash();
// 이미 쓰고 있는 명단은 절대 덮지 않는다. 링크를 다시 눌러도 안전해야 한다.
if (seeded && (S.demo || !S.children.length)){
  var fresh = blank();
  fresh.skin = S.skin;
  fresh.children = seeded.map(function(n){ return {id:uid(), name:n}; });
  var g = groupFromHash();
  if (g) fresh.group = g;
  bumpRev(fresh, S.rev);
  S = fresh;
  writeStore();
}
// 주소창과 공유 링크에 아이 이름이 남지 않도록 즉시 지운다.
if (location.hash && history.replaceState){
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
}

render(true);
})();
</script>
